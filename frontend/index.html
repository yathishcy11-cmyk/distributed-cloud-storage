<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YCloud</title><style>
:root{--bg:#071018;--panel:#0d1922;--line:#20313c;--text:#eef4f7;--muted:#95a5af;--accent:#ff6735}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,Arial}.shell{min-height:100vh;display:grid;grid-template-columns:250px 1fr}.side{border-right:1px solid var(--line);padding:28px 22px}.brand{font-weight:900;font-size:22px}.brand b{color:var(--accent)}.nav{margin-top:38px;display:grid;gap:8px}.nav div{padding:12px;border-radius:10px;color:var(--muted)}.nav .active{background:#122430;color:#fff}.main{padding:32px}.top{display:flex;justify-content:space-between;gap:15px}.top h1{font-size:34px;margin:0}.status{color:var(--muted);font-size:13px}.nodes{display:flex;gap:8px;flex-wrap:wrap}.node{border:1px solid #236848;color:#8ce0b6;padding:7px 10px;border-radius:999px;font-size:12px}.panel{border:1px solid var(--line);background:var(--panel);border-radius:18px;padding:20px;margin-top:24px}.drop{border:1px dashed #3d5260;border-radius:15px;padding:34px;text-align:center;cursor:pointer}.drop:hover{border-color:var(--accent)}button{cursor:pointer}.primary{background:var(--accent);border:0;color:#fff;padding:12px 16px;border-radius:10px;font-weight:800}.auth{display:flex;gap:8px;flex-wrap:wrap}.auth input{background:#08131b;color:#fff;border:1px solid var(--line);border-radius:9px;padding:10px 12px}.files{display:grid;gap:10px}.row{border:1px solid var(--line);border-radius:14px;padding:15px;display:grid;grid-template-columns:1fr auto;gap:15px;align-items:center}.meta,small{color:var(--muted);font-size:12px}.actions{display:flex;gap:8px}.actions button{background:#162631;border:1px solid var(--line);color:#fff;padding:8px 11px;border-radius:9px}.progress{height:8px;background:#182732;border-radius:999px;overflow:hidden;margin-top:10px}.bar{height:100%;width:0;background:var(--accent)}@media(max-width:760px){.shell{grid-template-columns:1fr}.side{display:none}.main{padding:18px}.row{grid-template-columns:1fr}}
</style><script src="config.js"></script></head><body><div class="shell"><aside class="side"><div class="brand">Y<b>Cloud</b></div><div class="nav"><div class="active">My Files</div><div>Versions</div><div>System Health</div></div><p class="status" style="margin-top:40px">Distributed object storage with chunking, replication and recovery.</p></aside><main class="main"><div class="top"><div><h1>My Files</h1><div class="status" id="sessionText">Not signed in</div></div><div class="nodes" id="nodes"></div></div><section class="panel"><h3>Account</h3><div class="auth"><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password (8+ chars)"><button class="primary" onclick="register()">Register</button><button class="primary" onclick="login()">Login</button><button class="primary" onclick="logout()">Logout</button></div><small id="authMsg"></small></section><section class="panel"><div class="drop" onclick="fileInput.click()"><strong>Upload a file</strong><br><small>Split into 5 MB chunks and upload concurrently.</small><input id="fileInput" type="file" hidden></div><div class="progress"><div class="bar" id="bar"></div></div><small id="uploadMsg"></small></section><section class="panel"><h3>Stored files</h3><div class="files" id="files"><small>Sign in to load files.</small></div></section></main></div><script>
const CONFIG_API=(window.YCLOUD_API_URL||'').trim().replace(/\/$/,'');const API=CONFIG_API&&CONFIG_API!=='REPLACE_WITH_YOUR_API_URL'?CONFIG_API:'http://localhost:8000';let token=localStorage.getItem('ycloud_token')||'';const $=id=>document.getElementById(id);function ah(){return token?{Authorization:'Bearer '+token}:{}}function fmt(n){if(!n)return'0 B';const u=['B','KB','MB','GB'];let i=0;while(n>=1024&&i<u.length-1){n/=1024;i++}return n.toFixed(i?1:0)+' '+u[i]}async function api(p,o={}){o.headers={...(o.headers||{}),...ah()};const r=await fetch(API+p,o);if(!r.ok){let m='Request failed';try{m=(await r.json()).detail||m}catch{}throw Error(m)}return r.json()}function logout(){token='';localStorage.removeItem('ycloud_token');$('sessionText').textContent='Not signed in';$('files').innerHTML='<small>Sign in to load files.</small>';$('authMsg').textContent='Signed out'}async function register(){try{const d=await api('/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:$('email').value,password:$('password').value})});token=d.token;localStorage.setItem('ycloud_token',token);$('sessionText').textContent=d.user.email;$('authMsg').textContent='Registered';loadFiles()}catch(e){$('authMsg').textContent=e.message}}async function login(){try{const d=await api('/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:$('email').value,password:$('password').value})});token=d.token;localStorage.setItem('ycloud_token',token);$('sessionText').textContent=d.user.email;$('authMsg').textContent='Signed in';loadFiles()}catch(e){$('authMsg').textContent=e.message}}$('fileInput').addEventListener('change',()=>uploadFile($('fileInput').files[0]));async function uploadFile(file){if(!file)return;if(!token){$('uploadMsg').textContent='Sign in first.';return}try{const s=await api('/uploads/start',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({filename:file.name,size_bytes:file.size,content_type:file.type||'application/octet-stream'})});let done=0;const jobs=[];for(let i=0;i<s.total_chunks;i++)jobs.push(async()=>{const blob=file.slice(i*s.chunk_size,Math.min(file.size,(i+1)*s.chunk_size));const form=new FormData();form.append('part',blob,file.name+'.part'+i);await api(`/uploads/${s.version_id}/chunks/${i}`,{method:'PUT',body:form});done++;$('bar').style.width=Math.round(done/s.total_chunks*100)+'%';$('uploadMsg').textContent=`Uploaded ${done}/${s.total_chunks} chunks`});const workers=Array.from({length:Math.min(4,jobs.length)},async(_,w)=>{for(let i=w;i<jobs.length;i+=Math.min(4,jobs.length))await jobs[i]()});await Promise.all(workers);await api(`/uploads/${s.version_id}/complete`,{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});$('uploadMsg').textContent='Upload complete — chunks replicated.';loadFiles()}catch(e){$('uploadMsg').textContent=e.message}}async function loadFiles(){try{const d=await api('/files'),box=$('files');box.innerHTML='';if(!d.files.length){box.innerHTML='<small>No files yet.</small>';return}d.files.forEach(f=>{const r=document.createElement('div');r.className='row';r.innerHTML=`<div><strong>${esc(f.filename)}</strong><div class="meta">${fmt(f.size_bytes)} · v${f.version} · ${f.status}</div></div><div class="actions"><button>Download</button><button>Versions</button><button>Delete</button></div>`;const b=r.querySelectorAll('button');b[0].onclick=()=>download(f.id,f.filename);b[1].onclick=async()=>alert(JSON.stringify(await api('/files/'+f.id+'/versions'),null,2));b[2].onclick=async()=>{if(confirm('Delete?')){await api('/files/'+f.id,{method:'DELETE'});loadFiles()}};box.appendChild(r)})}catch(e){$('files').innerHTML='<small>'+esc(e.message)+'</small>'}}async function download(id,name){const r=await fetch(API+'/files/'+id+'/download',{headers:ah()});if(!r.ok)return alert('Download failed');const b=await r.blob(),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;a.click();URL.revokeObjectURL(a.href)}async function health(){try{const h=await fetch(API+'/health').then(r=>r.json());$('nodes').innerHTML=h.healthy_storage_nodes.map(n=>`<span class="node">${n.split('//')[1]} ●</span>`).join('')}catch{}}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}if(!CONFIG_API||CONFIG_API==='REPLACE_WITH_YOUR_API_URL'){$('authMsg').textContent='Backend URL is not configured. Edit frontend/config.js after deploying the API.'}health();setInterval(health,5000);if(token){$('sessionText').textContent='Session restored';loadFiles()}
</script></body></html>
